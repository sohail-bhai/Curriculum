<!-- User Profile Page -->

{% extends "base.html" %}

{% block title %}My Profile - {{ block.super }}{% endblock %}

{% block content %}
<div class="p-6 max-w-4xl mx-auto space-y-6">
    <!-- Page Header -->
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-3xl font-bold text-gray-900">Profile Settings</h1>
            <p class="text-gray-600 mt-2">Manage your account information and preferences</p>
        </div>
        <div class="flex items-center gap-2">
            <span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-green-100 text-green-800">
                <svg class="w-4 h-4 mr-1" data-feather="check-circle"></svg>
                Active
            </span>
        </div>
    </div>
    
    <!-- Profile Sections -->
    <div class="grid gap-6" x-data="{ activeTab: 'profile' }">
        <div class="hidden lg:grid lg:grid-cols-4 lg:gap-6">
            <!-- Sidebar Navigation -->
            <div class="lg:col-span-1">
                <nav class="space-y-1 sticky top-6">
                    <button @click="activeTab = 'profile'"
                            :class="activeTab === 'profile' ? 'bg-blue-50 text-blue-700 border-l-4 border-blue-600' : 'text-gray-700 hover:bg-gray-50'"
                            class="w-full text-left px-4 py-2 rounded transition font-medium text-sm">
                        <svg class="w-4 h-4 inline mr-3" data-feather="user"></svg>
                        Profile
                    </button>
                    <button @click="activeTab = 'password'"
                            :class="activeTab === 'password' ? 'bg-blue-50 text-blue-700 border-l-4 border-blue-600' : 'text-gray-700 hover:bg-gray-50'"
                            class="w-full text-left px-4 py-2 rounded transition font-medium text-sm">
                        <svg class="w-4 h-4 inline mr-3" data-feather="lock"></svg>
                        Password
                    </button>
                    <button @click="activeTab = 'notifications'"
                            :class="activeTab === 'notifications' ? 'bg-blue-50 text-blue-700 border-l-4 border-blue-600' : 'text-gray-700 hover:bg-gray-50'"
                            class="w-full text-left px-4 py-2 rounded transition font-medium text-sm">
                        <svg class="w-4 h-4 inline mr-3" data-feather="bell"></svg>
                        Notifications
                    </button>
                    <button @click="activeTab = 'preferences'"
                            :class="activeTab === 'preferences' ? 'bg-blue-50 text-blue-700 border-l-4 border-blue-600' : 'text-gray-700 hover:bg-gray-50'"
                            class="w-full text-left px-4 py-2 rounded transition font-medium text-sm">
                        <svg class="w-4 h-4 inline mr-3" data-feather="sliders"></svg>
                        Preferences
                    </button>
                    <button @click="activeTab = 'security'"
                            :class="activeTab === 'security' ? 'bg-blue-50 text-blue-700 border-l-4 border-blue-600' : 'text-gray-700 hover:bg-gray-50'"
                            class="w-full text-left px-4 py-2 rounded transition font-medium text-sm">
                        <svg class="w-4 h-4 inline mr-3" data-feather="shield"></svg>
                        Security
                    </button>
                </nav>
            </div>
            
            <!-- Content Area -->
            <div class="lg:col-span-3">
                {% include "auth/profile_sections.html" %}
            </div>
        </div>
        
        <!-- Mobile Tabs -->
        <div class="lg:hidden">
            <div class="mb-6">
                <select @change="activeTab = $event.target.value" 
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent">
                    <option value="profile">Profile</option>
                    <option value="password">Password</option>
                    <option value="notifications">Notifications</option>
                    <option value="preferences">Preferences</option>
                    <option value="security">Security</option>
                </select>
            </div>
            
            {% include "auth/profile_sections.html" %}
        </div>
    </div>
</div>

<script>
    feather.replace();
</script>
{% endblock %}
