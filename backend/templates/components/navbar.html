<!-- Top Navigation Bar -->
<nav class="bg-white border-b border-gray-200 sticky top-0 z-30">
    <div class="flex items-center justify-between h-16 px-6">
        <!-- Left: Mobile Menu Button + Breadcrumb -->
        <div class="flex items-center space-x-4">
            <!-- Mobile Menu Toggle -->
            <button @click="sidebarOpen = !sidebarOpen" class="md:hidden p-2 rounded-lg hover:bg-gray-100">
                <svg class="w-5 h-5 text-gray-700" data-feather="menu"></svg>
            </button>
            
            <!-- Breadcrumb -->
            <div class="hidden sm:flex items-center space-x-2 text-sm">
                <a href="{% url 'dashboard' %}" class="text-gray-600 hover:text-gray-900">Dashboard</a>
                {% if page_title %}
                    <span class="text-gray-400">/</span>
                    <span class="text-gray-900 font-medium">{{ page_title }}</span>
                {% endif %}
            </div>
        </div>
        
        <!-- Right: Search + Notifications + User Menu -->
        <div class="flex items-center space-x-4">
            <!-- Search -->
            <div class="hidden md:flex items-center bg-gray-100 rounded-lg px-4 py-2">
                <svg class="w-4 h-4 text-gray-500" data-feather="search"></svg>
                <input type="text" placeholder="Search subjects..." 
                       class="bg-transparent ml-2 w-32 outline-none text-sm">
            </div>
            
            <!-- Notifications -->
            <div class="relative" x-data="{ open: false }">
                <button @click="open = !open" 
                        class="relative p-2 text-gray-600 hover:bg-gray-100 rounded-lg">
                    <svg class="w-5 h-5" data-feather="bell"></svg>
                    <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
                </button>
                
                <!-- Notification Dropdown -->
                <div x-show="open" @click.away="open = false"
                     class="absolute right-0 mt-2 w-80 bg-white rounded-lg shadow-xl border border-gray-200"
                     x-transition>
                    <div class="p-4 border-b border-gray-200">
                        <h3 class="font-semibold text-gray-900">Notifications</h3>
                    </div>
                    <div class="max-h-96 overflow-y-auto">
                        <a href="#" class="block px-4 py-3 hover:bg-gray-50 border-b border-gray-100">
                            <p class="text-sm font-medium text-gray-900">New subject submitted</p>
                            <p class="text-xs text-gray-600 mt-1">Data Structures - 2 hours ago</p>
                        </a>
                        <a href="#" class="block px-4 py-3 hover:bg-gray-50 border-b border-gray-100">
                            <p class="text-sm font-medium text-gray-900">Approval request</p>
                            <p class="text-xs text-gray-600 mt-1">Algorithm Analysis - 5 hours ago</p>
                        </a>
                    </div>
                    <div class="p-4 border-t border-gray-200 text-center">
                        <a href="#" class="text-sm text-primary-600 font-medium hover:text-primary-700">
                            View all notifications
                        </a>
                    </div>
                </div>
            </div>
            
            <!-- User Menu -->
            <div class="relative" x-data="{ open: false }">
                <button @click="open = !open" 
                        class="flex items-center space-x-2 p-2 rounded-lg hover:bg-gray-100">
                    <div class="w-8 h-8 rounded-full bg-primary-600 flex items-center justify-center text-white text-sm font-bold">
                        {{ user.first_name|first }}{{ user.last_name|first }}
                    </div>
                    <svg class="w-4 h-4 text-gray-600" data-feather="chevron-down"></svg>
                </button>
                
                <!-- User Dropdown -->
                <div x-show="open" @click.away="open = false"
                     class="absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-xl border border-gray-200"
                     x-transition>
                    <div class="p-4 border-b border-gray-200">
                        <p class="text-sm font-semibold text-gray-900">{{ user.first_name }} {{ user.last_name }}</p>
                        <p class="text-xs text-gray-600">{{ user.email }}</p>
                    </div>
                    <a href="{% url 'profile' %}" class="flex items-center px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">
                        <svg class="w-4 h-4 mr-2" data-feather="user"></svg>
                        Profile
                    </a>
                    <a href="{% url 'settings' %}" class="flex items-center px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">
                        <svg class="w-4 h-4 mr-2" data-feather="settings"></svg>
                        Settings
                    </a>
                    <hr class="my-2">
                    <a href="{% url 'logout' %}" class="flex items-center px-4 py-2 text-sm text-red-600 hover:bg-red-50">
                        <svg class="w-4 h-4 mr-2" data-feather="log-out"></svg>
                        Sign Out
                    </a>
                </div>
            </div>
        </div>
    </div>
</nav>
